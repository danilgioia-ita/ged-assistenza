name: GED Assistance — Windows 7

# GED ASSISTANCE (26 ottobre 2026). Danilo ha clienti con Windows 7, e la versione Flutter di RustDesk 1.5.0 parte
# solo da Windows 10. Per Windows 7 RustDesk usa ancora l'interfaccia «sciter» a 32 bit (i686): questo flusso e'
# il job build-for-windows-sciter di flutter-build.yml, senza firma di RustDesk e senza pubblicazioni.
# Un exe a 32 bit gira sia su Windows 7 a 32 bit sia su Windows 7 a 64 bit.
# Server, chiave, nome «GED Assistance» e variante (cliente = solo ricevere) stanno nel codice Rust
# (libs/hbb_common/src/config.rs), quindi valgono anche qui; l'icona Cuffia A e' res/icon.ico.
# Parte SOLO a mano. Il file esce come artefatto del giro.

on:
  workflow_dispatch:
    inputs:
      variante:
        description: 'cliente (si fa assistere) oppure tecnico (si collega)'
        required: true
        default: 'cliente'
        type: choice
        options: [cliente, tecnico]
  # PROVVISORIO: GitHub avvia a mano solo i flussi presenti sul ramo predefinito (ged), che qui non si tocca.
  # Questo avvio, limitato al ramo ged-win7 e a questo file, serve solo alle prove e si toglie dopo.
  push:
    branches: [ged-win7]
    paths: ['.github/workflows/ged-windows7.yml']

env:
  GED_VARIANTE: "${{ inputs.variante || 'cliente' }}"
  LLVM_VERSION: "15.0.6"
  VERSION: "1.5.0"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # Lo stesso commit di vcpkg di flutter-build.yml e ged-windows.yml (vcpkg.json ha la baseline legata a questo).
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  build-for-windows7-sciter:
    name: Windows 7 (sciter, i686)
    runs-on: windows-2022
    env:
      TARGET: i686-pc-windows-msvc
      VCPKG_TRIPLET: x86-windows-static
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang (32 bit)
        uses: rustdesk-org/install-llvm-action-32bit@6aa7d9ad3df84dff01cd4596dd0fc880a7f47fce # no release tag; commit 2026-05-26
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        shell: bash
        run: |
          # Come RustDesk: sciter (abi_thiscall) vuole nightly; toolchain i686 per caricare l'LLVM a 32 bit.
          # nightly-2023-10-13 e' anche precedente a Rust 1.76, che ha tolto Windows 7 dai bersagli supportati.
          rustup toolchain install nightly-2023-10-13-${TARGET} \
            --target ${TARGET} --component rustfmt \
            --profile minimal --no-self-update --force-non-host
          rustup default nightly-2023-10-13-${TARGET} --force-non-host

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022-sciter-ged-${{ inputs.variante || 'cliente' }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${VCPKG_TRIPLET} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Build GED Assistance (sciter)
        shell: bash
        run: |
          echo "GED_VARIANTE=${GED_VARIANTE}"
          python3 res/inline-sciter.py
          # Patch sciter x86, come RustDesk
          sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml
          cargo update -p sciter-rs --precise 674e07d3066ca9a92ced3816203ab6b652629d1e
          cargo build --locked --features inline,vram,hwcodec --release --bins
          mkdir -p ./Release
          mv ./target/release/rustdesk.exe ./Release/rustdesk.exe
          curl -LJ -o ./Release/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x32/sciter.dll
          curl -LJ -o ./usbmmidd_v2.zip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip usbmmidd_v2.zip
          # Come RustDesk: i file x64 restano, l'exe a 32 bit puo' girare su un Windows a 64 bit.
          rm -rf ./usbmmidd_v2/deviceinstaller.exe ./usbmmidd_v2/usbmmidd.bat
          mv ./usbmmidd_v2 ./Release || true

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          # GED: nelle proprieta' del file (tasto destro > Proprieta' > Dettagli) il cliente legge GED Assistance.
          sed -i 's/^ProductName = "RustDesk"/ProductName = "GED Assistance"/; s/^FileDescription = "RustDesk Remote Desktop"/FileDescription = "GED Assistance"/' libs/portable/Cargo.toml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release/ -o . -e ../../Release/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/GED-Assistance-${GED_VARIANTE}-${VERSION}-win7-x86.exe"
          ls -l ./SignOutput

      - name: L'exe di GED Assistance per Windows 7 come artefatto del giro
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ged-assistance-${{ inputs.variante || 'cliente' }}-windows7-x86
          path: ./SignOutput/GED-Assistance-*.exe
          retention-days: 14

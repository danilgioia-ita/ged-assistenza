name: GED Assistance — prova del motore su iPad (senza firma)

# PROVA DEL 6 NOVEMBRE 2026. Nessuna build iOS del motore e' mai riuscita qui: questo giro lo verifica una volta, prima
# di decidere fra la teleassistenza dentro l'app nativa (motore come libreria) e l'app Flutter aperta con un link.
# Niente firma e niente segreti: esce la libreria del motore per aarch64-apple-ios e l'app Flutter non firmata, come
# artefatti. La firma (sviluppo, via cavo) si fa sul Mac. Parte da sola solo su questo ramo.

on:
  push:
    branches: [ged-ios-pulito]
  workflow_dispatch:

env:
  GED_VARIANTE: "tecnico"
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  motore-ios:
    name: motore e app senza firma (aarch64-apple-ios)
    runs-on: macos-latest
    needs: [generate-bridge]
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: brew install nasm yasm

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; echo; done
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-ios
          key: aarch64-apple-ios

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Build rustdesk lib
        run: |
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib
          test -f target/aarch64-apple-ios/release/liblibrustdesk.a
          ls -lh target/aarch64-apple-ios/release/liblibrustdesk.a

      - name: Build app Flutter senza firma
        run: |
          cd flutter
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos && ditto -c -k --keepParent Runner.app ged-assistance-tecnico-senza-firma.zip

      - name: Upload motore
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: motore-ios-${{ github.run_number }}
          path: target/aarch64-apple-ios/release/liblibrustdesk.a
          if-no-files-found: error

      - name: Upload app senza firma
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-ios-senza-firma-${{ github.run_number }}
          path: flutter/build/ios/iphoneos/ged-assistance-tecnico-senza-firma.zip
          if-no-files-found: error

name: GED Assistance — iPad e iPhone

# GED ASSISTANCE PER iPAD E iPHONE (27 ottobre 2026). Ricavato dal job build-rustdesk-ios di flutter-build.yml e dallo
# stile di ged-mac.yml. Decisione di GED Service: UNA app sola, ottimizzata per iPadOS; qui esce la versione TECNICO
# (sola uscita, chi si collega ai clienti), distribuita SOLO internamente con TestFlight interno. Mai App Store pubblico.
#
# Parte SOLO a mano (workflow_dispatch): i minuti dei Mac costano, quindi niente push e niente pull request.
# Il primo giro si fa con «carica_su_testflight» spento: prova solo la compilazione e la firma, e lascia il .ipa come
# artefatto. Si carica su TestFlight solo quando la build e' gia' stata vista buona.
#
# SEGRETI (solo i nomi; i valori mai nel repo):
#   APPLE_DISTRIBUTION_P12_BASE64 + APPLE_DISTRIBUTION_P12_PASSWORD  certificato «Apple Distribution» del team X728M3V35H
#   APPLE_APPSTORE_PROFILE_BASE64                                    profilo «GED Assistance Tecnico App Store»
#   APPLE_NOTARY_KEY_P8_BASE64 + APPLE_NOTARY_KEY_ID + APPLE_NOTARY_ISSUER_ID
#                                                                    chiave API di App Store Connect (gia' esistente, la
#                                                                    stessa del Mac): serve solo per caricare su TestFlight
# Se ne manca uno il flusso si FERMA subito, prima di spendere minuti: una firma «a meta'» produrrebbe un .ipa che
# sembra buono e che Apple rifiuta solo all'ultimo.

on:
  workflow_dispatch:
    inputs:
      variante:
        description: 'tecnico (si collega ai clienti). «cliente» su iOS non esiste: il flusso si ferma'
        required: true
        default: 'tecnico'
        type: choice
        options: [tecnico, cliente]
      carica_su_testflight:
        description: 'Dopo la build, carica il .ipa su TestFlight (spento = prova solo la build)'
        required: true
        default: false
        type: boolean

env:
  # Compilata DENTRO la libreria Rust (ged_variante() in libs/hbb_common/src/config.rs): deve stare nell'ambiente
  # di tutto il job, altrimenti la libreria nascerebbe senza variante.
  GED_VARIANTE: "${{ inputs.variante }}"
  RUST_VERSION: "1.75" # come bridge.yml e il job iOS di RustDesk: oltre la 1.75 cambia l'ABI e la libreria non si lega
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d" # lo stesso di ged-mac.yml
  VERSION: "1.5.0"
  # Il nome esatto del profilo sul portale Apple: lo si confronta con quello che c'e' DENTRO il file installato.
  GED_PROFILO_NOME: "GED Assistance Tecnico App Store"
  GED_TEAM: "X728M3V35H"

jobs:
  controlli:
    name: controlli prima di spendere minuti
    runs-on: ubuntu-latest
    steps:
      - name: Solo la versione tecnico
        run: |
          if [ "${{ inputs.variante }}" != "tecnico" ]; then
            echo "::error::Su iPad e iPhone esiste solo la versione tecnico (chi si collega). Un iPhone non puo' farsi assistere con questa app: rilancia con variante = tecnico."
            exit 1
          fi

      - name: Controllo dei segreti prima di spendere minuti
        env:
          S_P12: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          S_P12_PW: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          S_PROFILO: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
          S_P8: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          S_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          S_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          CARICA: ${{ inputs.carica_su_testflight }}
        run: |
          # Si nominano i segreti che mancano, mai i valori. Per costruire servono certificato e profilo; la chiave
          # di App Store Connect serve solo se si carica su TestFlight, ma la si pretende subito in quel caso:
          # scoprire a fine build (dopo 40 minuti) che manca e' il peggio dei modi.
          MANCANO=""
          [ -n "$S_P12" ]    || MANCANO="$MANCANO APPLE_DISTRIBUTION_P12_BASE64"
          [ -n "$S_P12_PW" ] || MANCANO="$MANCANO APPLE_DISTRIBUTION_P12_PASSWORD"
          [ -n "$S_PROFILO" ] || MANCANO="$MANCANO APPLE_APPSTORE_PROFILE_BASE64"
          if [ "$CARICA" = "true" ]; then
            [ -n "$S_P8" ]     || MANCANO="$MANCANO APPLE_NOTARY_KEY_P8_BASE64"
            [ -n "$S_KEY_ID" ] || MANCANO="$MANCANO APPLE_NOTARY_KEY_ID"
            [ -n "$S_ISSUER" ] || MANCANO="$MANCANO APPLE_NOTARY_ISSUER_ID"
          fi
          if [ -n "$MANCANO" ]; then
            echo "::error::Mi fermo: mancano questi segreti del repository:$MANCANO. Servono (certificato Apple Distribution e profilo App Store del team ${GED_TEAM}). Senza, non firmo a meta': il file uscirebbe inservibile."
            exit 1
          fi
          echo "Segreti presenti (solo i nomi controllati, nessun valore stampato)."

  generate-bridge:
    needs: [controlli]
    uses: ./.github/workflows/bridge.yml

  build-ios:
    name: ipa ${{ inputs.variante }} (aarch64-apple-ios)
    runs-on: macos-latest
    needs: [controlli, generate-bridge]
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          brew install nasm yasm

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet arm64-ios \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-arm64-ios-rel-out.log" || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-ios
          key: aarch64-apple-ios

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Build rustdesk lib
        run: |
          rustup target add aarch64-apple-ios
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib
          # Il Runner di Xcode lega questa libreria: se non c'e', il .ipa nascerebbe senza motore.
          test -f target/aarch64-apple-ios/release/liblibrustdesk.a

      - name: Versione di Xcode in uso
        run: |
          # Apple accetta su TestFlight solo build fatte con l'SDK che chiede in quel momento. Lo si scrive nel
          # registro cosi' un eventuale rifiuto in caricamento si spiega senza indovinare.
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Certificato e profilo di firma (portachiavi temporaneo)
        env:
          P12_B64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PW: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILO_B64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # Portachiavi usa e getta: il certificato non tocca mai quello del runner e sparisce a fine giro (passo
          # «Pulizia» in fondo, che gira anche se la build fallisce).
          LAV="$RUNNER_TEMP/firma-ios"; mkdir -p "$LAV"; chmod 700 "$LAV"
          KC="$LAV/ged-ios.keychain-db"; KPW="$(openssl rand -hex 16)"
          echo "GED_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "GED_LAV=$LAV" >> "$GITHUB_ENV"
          security list-keychains -d user | tr -d '"' > "$LAV/lista-portachiavi.txt"

          printf '%s' "$P12_B64" | base64 --decode > "$LAV/dist.p12"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          security import "$LAV/dist.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$LAV/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(cat "$LAV/lista-portachiavi.txt")

          # Deve esserci un'identita' «Apple Distribution» del NOSTRO team, non un certificato qualunque.
          security find-identity -v -p codesigning "$KC" | tee "$LAV/identita.txt"
          grep -q "Apple Distribution" "$LAV/identita.txt" \
            || { echo "::error::Nel .p12 non c'e' un certificato «Apple Distribution» valido: mi fermo."; exit 1; }
          grep -q "(${GED_TEAM})" "$LAV/identita.txt" \
            || { echo "::error::Il certificato non e' del team ${GED_TEAM}: mi fermo."; exit 1; }

          # Il profilo va in questa cartella con il suo UUID come nome: Xcode lo trova cosi'.
          printf '%s' "$PROFILO_B64" | base64 --decode > "$LAV/profilo.mobileprovision"
          security cms -D -i "$LAV/profilo.mobileprovision" > "$LAV/profilo.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$LAV/profilo.plist")"
          NOME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$LAV/profilo.plist")"
          TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$LAV/profilo.plist")"
          APPID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$LAV/profilo.plist")"
          SCADE="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$LAV/profilo.plist")"
          echo "Profilo: $NOME — team $TEAM — app $APPID — scade $SCADE"
          [ "$NOME" = "$GED_PROFILO_NOME" ] \
            || { echo "::error::Il profilo si chiama «$NOME», mi aspettavo «$GED_PROFILO_NOME»: mi fermo."; exit 1; }
          [ "$TEAM" = "$GED_TEAM" ] \
            || { echo "::error::Il profilo e' del team $TEAM, non di $GED_TEAM: mi fermo."; exit 1; }
          # Un profilo di sviluppo o ad hoc contiene la lista dei dispositivi: quello App Store no. Se c'e', e' il profilo sbagliato.
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$LAV/profilo.plist" >/dev/null 2>&1; then
            echo "::error::Il profilo elenca dei dispositivi: non e' un profilo App Store. Mi fermo."; exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$LAV/profilo.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "GED_PROFILO_PATH=$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision" >> "$GITHUB_ENV"

          # exportOptions.plist deve nominare ESATTAMENTE questo profilo e questo team: se parla ancora di RustDesk
          # (team HZF9JMC8YN) l'esportazione fallirebbe dopo la build, o peggio firmerebbe con altro.
          EO="flutter/ios/exportOptions.plist"
          grep -q "<string>${GED_PROFILO_NOME}</string>" "$EO" \
            || { echo "::error::$EO non nomina il profilo «${GED_PROFILO_NOME}»: va corretto prima di costruire."; exit 1; }
          grep -q "<string>${GED_TEAM}</string>" "$EO" \
            || { echo "::error::$EO non indica il team ${GED_TEAM}: va corretto prima di costruire."; exit 1; }
          grep -q "<string>${APPID#${TEAM}.}</string>" "$EO" \
            || { echo "::error::$EO non usa il bundle id del profilo (${APPID#${TEAM}.}): va corretto prima di costruire."; exit 1; }

      - name: Build rustdesk (flutter build ipa, firmato)
        shell: bash
        run: |
          set -euo pipefail
          pushd flutter
          # --build-number: TestFlight rifiuta due caricamenti con lo stesso numero di build; il numero del giro
          # di GitHub cresce sempre. Il nome versione resta quello di pubspec.yaml.
          flutter build ipa --release \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --export-options-plist=ios/exportOptions.plist
          popd
          ls -la flutter/build/ios/ipa/
          IPA="$(ls flutter/build/ios/ipa/*.ipa | head -n 1)"
          test -f "$IPA"
          # Prova che dentro ci sia il NOSTRO profilo e non uno rimasto da RustDesk.
          rm -rf "$RUNNER_TEMP/ipa-aperto" && mkdir -p "$RUNNER_TEMP/ipa-aperto"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-aperto"
          APP="$(ls -d "$RUNNER_TEMP"/ipa-aperto/Payload/*.app | head -n 1)"
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/ipa-profilo.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/ipa-profilo.plist")" = "$GED_PROFILO_NOME"
          codesign -dvv "$APP" 2>&1 | grep -E "Identifier|TeamIdentifier|Authority" || true
          echo "GED_IPA=$IPA" >> "$GITHUB_ENV"

      - name: Upload ipa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ged-assistance-tecnico-ios-${{ github.run_number }}
          path: flutter/build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Carica su TestFlight
        if: ${{ inputs.carica_su_testflight }}
        env:
          NOTARY_P8_B64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          # altool cerca la chiave in ~/.appstoreconnect/private_keys/AuthKey_<id>.p8: e' il suo posto fisso,
          # non si puo' indicare un percorso. Il file viene tolto nel passo di pulizia.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$NOTARY_P8_B64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${NOTARY_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${NOTARY_KEY_ID}.p8"
          # Se Apple rifiuta il .ipa (scheda app mancante, numero di build gia' usato, SDK vecchio) altool esce con
          # codice diverso da 0 e il giro diventa rosso: e' voluto, mai un «caricato» senza prova.
          xcrun altool --upload-app --type ios --file "$GED_IPA" \
            --apiKey "$NOTARY_KEY_ID" --apiIssuer "$NOTARY_ISSUER" --output-format normal
          echo "Caricato su App Store Connect. Compare in TestFlight dopo l'elaborazione di Apple (qualche minuto)."

      - name: Pulizia di chiavi, profilo e portachiavi
        if: always()
        run: |
          # Gira anche se la build e' fallita: certificato e chiave API non devono restare sul runner.
          if [ -n "${GED_KEYCHAIN:-}" ]; then
            if [ -f "${GED_LAV:-/nonesiste}/lista-portachiavi.txt" ]; then
              security list-keychains -d user -s $(cat "$GED_LAV/lista-portachiavi.txt") || true
            fi
            security delete-keychain "$GED_KEYCHAIN" || true
          fi
          [ -n "${GED_PROFILO_PATH:-}" ] && rm -f "$GED_PROFILO_PATH" || true
          [ -n "${GED_LAV:-}" ] && rm -rf "$GED_LAV" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/ipa-aperto" "$RUNNER_TEMP/ipa-profilo.plist" || true

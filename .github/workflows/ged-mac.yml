name: GED Assistance — Mac

# GED ASSISTANCE (25 ottobre 2026). Ricavato da flutter-build.yml di RustDesk 1.5.0: Mac Apple Silicon (aarch64).
# Parte SOLO a mano; «variante» sceglie la versione (cliente = solo ricevere, tecnico = solo collegarsi, vedi
# ged_variante() in libs/hbb_common/src/config.rs). I file escono come artefatti del giro.
#
# FIRMA E NOTARIZZAZIONE (26 ottobre 2026). Senza, il Mac apre il .dmg solo col tasto destro e un avviso che spaventa.
# Si fanno qui quando ci sono i segreti: APPLE_DEVELOPER_ID_APP_JSON (il certificato Developer ID Application del
# team X728M3V35H, consegnato da M3GAN col Face ID: json {p12_base64, password, identita}) e i tre APPLE_NOTARY_*
# (chiave API di App Store Connect, da ops/firma-apple/chiave-notarizzazione.sh). Senza segreti il .dmg esce
# non firmato come prima. I passi di firma di RustDesk (MACOS_P12_BASE64, rcodesign) restano spenti: non li usiamo.

on:
  workflow_dispatch:
    inputs:
      variante:
        description: 'cliente (si fa assistere) oppure tecnico (si collega)'
        required: true
        default: 'tecnico'
        type: choice
        options: [cliente, tecnico]

env:
  GED_VARIANTE: "${{ inputs.variante }}"
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  MAC_RUST_VERSION: "1.81" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  # Windows arm64 only: the first stable Flutter to ship a native arm64 Windows Dart SDK +
  # engine is 3.44. Every other platform stays on FLUTTER_VERSION (3.24.5) until Windows 7
  # support is restored after the upstream-wide Flutter bump. The arm64 job patches the few
  # 3.44-only source/pubspec changes on the fly (see "Patch RustDesk sources for Flutter 3.44").
  FLUTTER_WINDOWS_ARM_VERSION: "3.44.9"
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "ged"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2026.07.29
  # If we change the `VCPKG COMMIT_ID`, please remember:
  # 1. Call `$VCPKG_ROOT/vcpkg x-update-baseline` to update the baseline in `vcpkg.json`.
  #  Or we may face build issue like 
  #  https://github.com/rustdesk/rustdesk/actions/runs/14414119794/job/40427970174
  # 2. Update the `VCPKG_COMMIT_ID` in `ci.yml` and `playground.yml`.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836" # 2025.01.13, got "/opt/artifacts/vcpkg/vcpkg: No such file or directory" with latest version
  VERSION: "1.5.0"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: "true"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2"
  # Solo «si»/«no»: il valore dei segreti non entra nell'ambiente di tutti i passi, solo in quelli che firmano.
  GED_FIRMA_MAC: "${{ secrets.APPLE_DEVELOPER_ID_APP_JSON != '' && secrets.APPLE_NOTARY_KEY_P8_BASE64 != '' && 'si' || 'no' }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-for-macOS:
    name: ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: aarch64-apple-darwin,
              os: macos-14,
              # extra-build-args: "--disable-flutter-texture-render", # disable this for mac, because we see a lot of users reporting flickering both on arm and x64, and we can not confirm if texture rendering has better performance if htere is no vram, https://github.com/rustdesk/rustdesk/issues/6296
              extra-build-args: "--screencapturekit",
              arch: aarch64,
              vcpkg-triplet: arm64-osx,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Import the codesign cert
        if: env.MACOS_P12_BASE64 != null
        uses: apple-actions/import-codesign-certs@253ddeeac23f2bdad1646faac5c8c2832e800071 # v1
        with:
          p12-file-base64: ${{ secrets.MACOS_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
          keychain: rustdesk

      - name: Check sign and import sign key
        if: env.MACOS_P12_BASE64 != null
        run: |
          security default-keychain -s rustdesk.keychain
          security find-identity -v

      - name: Import notarize key
        if: env.MACOS_P12_BASE64 != null
        uses: timheuer/base64-to-file@adaa40c0c581f276132199d4cf60afa07ce60eac # v1.2
        with:
          # https://gregoryszorc.com/docs/apple-codesign/stable/apple_codesign_rcodesign.html#notarizing-and-stapling
          fileName: rustdesk.json
          fileDir: ${{ github.workspace }}
          encodedString: ${{ secrets.MACOS_NOTARIZE_JSON }}

      - name: Install rcodesign tool
        if: env.MACOS_P12_BASE64 != null
        shell: bash
        run: |
          pushd /tmp
          wget https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.22.0/apple-codesign-0.22.0-macos-universal.tar.gz
          tar -zxvf apple-codesign-0.22.0-macos-universal.tar.gz
          mv apple-codesign-0.22.0-macos-universal/rcodesign /usr/local/bin
          popd

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          # pkg-config is handled in a separate step, because it may be already installed by `macos-latest`(14.7.1) runner
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # Install NASM 2.16.x from official release.
          # Do NOT use `brew install nasm` which installs NASM 3.x.
          # NASM 3.x is a complete rewrite with incompatible CLI options and removed features.
          # aom and other multimedia libraries require NASM 2.x for x86/x86_64 assembly.
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Test cursor sizing
        if: ${{ false && matrix.job.arch == 'aarch64' }}
        working-directory: flutter
        run: flutter test --timeout 60s test/cursor_size_test.dart test/cursor_replay_test.dart test/cursor_default_test.dart

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true

      - name: Show version information (Rust, cargo, Clang)
        shell: bash
        run: |
          clang --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V

      - name: Build rustdesk
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Nome GED Assistance nel Finder (versione tecnico)
        if: inputs.variante == 'tecnico'
        run: |
          # L'icona e' gia' la nostra, ma la cartella e il nome nel Finder dicevano «RustDesk». Si cambiano PRIMA di
          # firmare (la firma copre Info.plist). La versione cliente ha il passo suo, qui sotto: installa un servizio e
          # deve rinominare anche l'eseguibile e il bundle id.
          # «Tecnico» nel nome (Danilo, 26/10): la versione cliente si chiama «GED Assistance.app» e sullo stesso Mac le
          # due si sovrascriverebbero in Applicazioni.
          R=./flutter/build/macos/Build/Products/Release
          /usr/libexec/PlistBuddy -c "Set :CFBundleName GED Assistance Tecnico" "$R/RustDesk.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string GED Assistance Tecnico" "$R/RustDesk.app/Contents/Info.plist"
          # Bundle id nostro (Danilo, 26/10): con com.carriez.rustdesk, lo stesso del RustDesk ufficiale, macOS apriva i
          # link rustdesk://<id> della rubrica del CRM nel RustDesk ufficiale. Lo schema dei link resta «rustdesk»
          # (il CRM genera rustdesk://<id>). Il tecnico e' in sola uscita e non installa servizi: il bundle id lo usa
          # solo la riscrittura dei plist dei servizi (get_bundle_id in src/platform/macos.rs, che lo legge a runtime);
          # configurazione e preferenze vanno per ORG + APP_NAME, non per bundle id.
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier it.gedservice.assistenza.tecnico" "$R/RustDesk.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$R/RustDesk.app/Contents/Info.plist")" = "it.gedservice.assistenza.tecnico"
          # Strumenti cassa (Danilo, 27/10, «stesso rilascio»): il programma locale (Node puro, senza dipendenze) entra nelle
          # Resources dell'app, SOLO nel tecnico e PRIMA di firmare (la firma sigilla anche le Resources). Senza test: non
          # servono a chi usa l'app. L'app lo avvia con il node del Mac (desktop/widgets/ged_strumenti_cassa.dart).
          mkdir -p "$R/RustDesk.app/Contents/Resources/strumenti-cassa"
          cp -R strumenti-cassa/server.mjs strumenti-cassa/lib strumenti-cassa/public strumenti-cassa/dati "$R/RustDesk.app/Contents/Resources/strumenti-cassa/"
          test -f "$R/RustDesk.app/Contents/Resources/strumenti-cassa/server.mjs"
          test -f "$R/RustDesk.app/Contents/Resources/strumenti-cassa/lib/listabianca.mjs"
          test -f "$R/RustDesk.app/Contents/Resources/strumenti-cassa/public/index.html"
          test -f "$R/RustDesk.app/Contents/Resources/strumenti-cassa/dati/profili.json"
          # Le casse stanno nella rete locale: da Sequoia il Mac chiede il permesso alle app e, senza questa frase nel
          # pacchetto, lo nega in silenzio (le connessioni alla cassa falliscono come «irraggiungibile»). Il processo
          # Node figlio risponde all'app che lo ha avviato.
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string GED Assistance Tecnico deve raggiungere le casse fiscali nella rete del cliente (Strumenti cassa)." "$R/RustDesk.app/Contents/Info.plist"
          mv "$R/RustDesk.app" "$R/GED Assistance Tecnico.app"
          echo "GED_APP=GED Assistance Tecnico.app" >> "$GITHUB_ENV"
          echo "GED_VOLNAME=GED Assistance Tecnico" >> "$GITHUB_ENV"

      - name: Nome GED Assistance ovunque (versione cliente)
        if: inputs.variante == 'cliente'
        run: |
          # Il cliente deve vedere «GED Assistance» nel Finder, nel Dock e nelle richieste di permesso del Mac
          # (Registrazione schermo, Accessibilita'). Qui non basta il nome nel Finder come per il tecnico: il codice
          # (APP_NAME = «GED Assistance») cerca /Applications/GED Assistance.app/Contents/MacOS/GED Assistance — per
          # i plist del servizio e per riconoscere il proprio processo --server sul canale IPC (src/ipc/auth.rs) —
          # quindi si rinominano anche l'eseguibile e CFBundleExecutable. Il bundle id e' il nostro: i permessi del
          # cliente restano legati a GED Service e non si confondono con un RustDesk gia' installato.
          # Tutto PRIMA di firmare: la firma copre Info.plist e l'eseguibile.
          set -euo pipefail
          R=./flutter/build/macos/Build/Products/Release
          P="$R/RustDesk.app/Contents/Info.plist"
          test -x "$R/RustDesk.app/Contents/MacOS/RustDesk"
          test -x "$R/RustDesk.app/Contents/MacOS/service"
          mv "$R/RustDesk.app/Contents/MacOS/RustDesk" "$R/RustDesk.app/Contents/MacOS/GED Assistance"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable GED Assistance" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName GED Assistance" "$P"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string GED Assistance" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier it.gedservice.assistenza" "$P"
          mv "$R/RustDesk.app" "$R/GED Assistance.app"
          echo "GED_APP=GED Assistance.app" >> "$GITHUB_ENV"
          ls -la "$R/GED Assistance.app/Contents/MacOS"
          /usr/libexec/PlistBuddy -c "Print" "$R/GED Assistance.app/Contents/Info.plist" | grep -E "CFBundle(Executable|Name|DisplayName|Identifier) "

      - name: Firma Developer ID dell'app (GED Service)
        if: env.GED_FIRMA_MAC == 'si'
        env:
          CERT_JSON: ${{ secrets.APPLE_DEVELOPER_ID_APP_JSON }}
        run: |
          set -euo pipefail
          LAV="$RUNNER_TEMP/firma"; mkdir -p "$LAV"; chmod 700 "$LAV"
          KC="$LAV/ged.keychain-db"; KPW="$(openssl rand -hex 16)"
          printf '%s' "$CERT_JSON" | jq -r .p12_base64 | base64 --decode > "$LAV/app.p12"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          security import "$LAV/app.p12" -k "$KC" -P "$(printf '%s' "$CERT_JSON" | jq -r .password)" -T /usr/bin/codesign
          rm -f "$LAV/app.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITA="$(printf '%s' "$CERT_JSON" | jq -r .identita)"
          echo "GED_IDENTITA=$IDENTITA" >> "$GITHUB_ENV"
          echo "GED_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          APP="./flutter/build/macos/Build/Products/Release/${GED_APP:-RustDesk.app}"
          # --preserve-metadata=entitlements: ri-firmando si perderebbero i permessi che flutter ha messo nell'app
          # (microfono, rete); --options runtime e --timestamp sono quelli che Apple chiede per notarizzare.
          codesign --force --deep --strict --options runtime --timestamp --preserve-metadata=entitlements \
            --keychain "$KC" -s "$IDENTITA" "$APP" -v
          # VIA IL PERMESSO DA SVILUPPO. Il 26/10 Apple ha rifiutato il primo .dmg per un solo motivo: l'eseguibile
          # chiedeva com.apple.security.get-task-allow (lo aggiunge la firma ad-hoc di Xcode, non Release.entitlements).
          # Lo si toglie dai permessi preservati e si ri-firma il pacchetto principale; se resta, ci si ferma qui
          # invece di aspettare il rifiuto di Apple.
          codesign -d --entitlements - --xml "$APP" > "$LAV/permessi.plist"
          /usr/libexec/PlistBuddy -c "Delete :com.apple.security.get-task-allow" "$LAV/permessi.plist" 2>/dev/null || true
          codesign --force --strict --options runtime --timestamp --entitlements "$LAV/permessi.plist" \
            --keychain "$KC" -s "$IDENTITA" "$APP" -v
          if codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q get-task-allow; then
            echo "::error::l'app chiede ancora get-task-allow: Apple la rifiuterebbe"; exit 1
          fi
          codesign --verify --deep --strict -vv "$APP"

      - name: create unsigned dmg
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --volname "${GED_VOLNAME:-GED Assistance}" --icon "${GED_APP:-RustDesk.app}" 200 190 --hide-extension "${GED_APP:-RustDesk.app}" --window-size 800 400 --app-drop-link 600 185 rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg "./flutter/build/macos/Build/Products/Release/${GED_APP:-RustDesk.app}"

      - name: Firma e notarizzazione del .dmg
        if: env.GED_FIRMA_MAC == 'si' && env.UPLOAD_ARTIFACT == 'true'
        env:
          NOTARY_P8_B64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg"
          LAV="$RUNNER_TEMP/firma"
          codesign --force --timestamp --keychain "$GED_KEYCHAIN" -s "$GED_IDENTITA" "$DMG"
          printf '%s' "$NOTARY_P8_B64" | base64 --decode > "$LAV/AuthKey_$NOTARY_KEY_ID.p8"
          xcrun notarytool submit "$DMG" --key "$LAV/AuthKey_$NOTARY_KEY_ID.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER" --wait --timeout 40m --output-format json > "$LAV/esito.json" || true
          cat "$LAV/esito.json"; echo
          STATO="$(jq -r '.status // empty' "$LAV/esito.json")"
          if [ "$STATO" != "Accepted" ]; then
            # Il motivo del rifiuto Apple lo scrive solo nel registro della richiesta: senza, si indovina.
            ID="$(jq -r '.id // empty' "$LAV/esito.json")"
            [ -n "$ID" ] && xcrun notarytool log "$ID" --key "$LAV/AuthKey_$NOTARY_KEY_ID.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" || true
            echo "::error::notarizzazione non accettata (stato: ${STATO:-nessuno})"; exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG"

      - name: Via chiavi e portachiavi
        if: always() && env.GED_FIRMA_MAC == 'si'
        run: |
          [ -n "${GED_KEYCHAIN:-}" ] && security delete-keychain "$GED_KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/firma"

      - name: Upload unsigned macOS app
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-macos-${{ matrix.job.arch }}
          path: rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg # can not upload the directory directly or tar.gz, which destroy the link structure, causing the codesign failed

